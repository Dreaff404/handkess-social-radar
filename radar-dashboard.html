<html lang="de">

<script src="radar-dashboard-thema.js"></script>
<style>
  :root { --bg: #f4f5f7; --surface: #fff; --ink: #14161a; --muted: #5d6470; --line: #e3e6ea; --akz: #0b0b0b; --akz-soft: #CDDE30; --marke: #CDDE30; --mein-bg: #F3F7D6;
    --gut: #1f7a4d; --gut-soft: #e2f3ea; --schw: #b3261e; --schw-soft: #fbe8e6; --gelb: #9a6a00; --radius: 12px; --schrift: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --titel: var(--schrift); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #101215; --surface: #191c21; --ink: #e9ebee; --muted: #9aa1ab; --line: #2b3038; --akz: #CDDE30; --akz-soft: #2c3110; --marke: #CDDE30; --gut: #7fd8a7; --gut-soft: #17301f; --schw: #ff8a80; --schw-soft: #3a1d1b; --gelb: #e6b64c; } }
  :root[data-theme="dark"] { --bg: #101215; --surface: #191c21; --ink: #e9ebee; --muted: #9aa1ab; --line: #2b3038; --akz: #CDDE30; --akz-soft: #2c3110; --marke: #CDDE30; --gut: #7fd8a7; --gut-soft: #17301f; --schw: #ff8a80; --schw-soft: #3a1d1b; --gelb: #e6b64c; }
  :root[data-look="paper"] { --bg: #EFE8D8; --surface: #F8F3E7; --ink: #2B2620; --muted: #6E655A; --line: #D9CFBA; --akz: #3B4F9E; --akz-soft: #e3e0e8; --marke: #B9C43A; --gut: #2F7A66; --gut-soft: #dfe9dc; --schw: #A4481F; --schw-soft: #f1dfd2; --gelb: #B27B12; --radius: 6px; --titel: "Iowan Old Style", Palatino, Georgia, serif; }
  @media (prefers-color-scheme: dark) { :root[data-look="paper"]:not([data-theme="light"]) { --bg: #1C1A17; --surface: #25221E; --ink: #E4DCCB; --muted: #A39A8A; --line: #3A352E; --akz: #9fb0ea; --akz-soft: #2c2f3d; --marke: #B9C43A; --gut: #8cc9b3; --gut-soft: #1f2d27; --schw: #e09a78; --schw-soft: #3a2a20; --gelb: #e0b45a; } }
  :root[data-look="paper"][data-theme="dark"] { --bg: #1C1A17; --surface: #25221E; --ink: #E4DCCB; --muted: #A39A8A; --line: #3A352E; --akz: #9fb0ea; --akz-soft: #2c2f3d; --marke: #B9C43A; --gut: #8cc9b3; --gut-soft: #1f2d27; --schw: #e09a78; --schw-soft: #3a2a20; --gelb: #e0b45a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--schrift); }

  main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }
  header.kopf { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

  /* HandKess-Branding – Platzhalter (2026-11-13) */
  .hk-symbol { width: 1.15em; height: 1.15em; vertical-align: -0.18em; margin-right: .35em; }
  .hk { display: inline-flex; align-items: center; font: 900 1em/1 "Arial Black", "Helvetica Neue", Arial, sans-serif; letter-spacing: .01em; color: var(--ink); white-space: nowrap; }
    .hk-punkt { width: .42em; height: .42em; border-radius: 50%; background: var(--marke); margin: 0 .16em; }
    .hk-kess { font-style: italic; padding: 0 .12em; background: linear-gradient(transparent 58%, var(--marke) 58%); }
    .hk-sub { font-weight: 500; margin-left: .55em; color: var(--muted); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hk-kess { background: none; color: var(--marke); } }
  :root[data-theme="dark"] .hk-kess { background: none; color: var(--marke); }
  .reihe { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; }

  td.aktion { white-space: nowrap; }

  th, td { padding: 8px 8px; }
  tr.gruppe td { background: var(--bg); font-weight: 600; font-family: var(--titel); padding-top: 14px; }
  select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 34px; }
  button.klein { min-height: 34px; padding: 4px 10px; border-radius: 8px; margin-left: 4px; }

  :root { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #6250d6; }

  :root[data-theme="dark"] { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9085e9; }
  .graphen { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 12px; }

  .linie { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .punkt-k { stroke: var(--surface); stroke-width: 2; }
  .s1 { stroke: var(--s1); color: var(--s1); } .s2 { stroke: var(--s2); color: var(--s2); } .s3 { stroke: var(--s3); color: var(--s3); } .s4 { stroke: var(--s4); color: var(--s4); }
  circle.s1 { fill: var(--s1); } circle.s2 { fill: var(--s2); } circle.s3 { fill: var(--s3); } circle.s4 { fill: var(--s4); }
  i.punkt { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: -1px; }
  .kreuz { stroke: var(--muted); stroke-width: 1; }

  .tipp b { color: var(--ink); }
  .legende { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .trends { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; margin-top: 8px; }
  details { margin-top: 6px; font-size: 12px; color: var(--muted); } summary { cursor: pointer; }
  table.klein-tab th, table.klein-tab td { padding: 3px 8px; font-size: 12px; }
  .leer.klein { padding: 16px; font-size: 13px; }
  .reihe.klein { margin: 0 0 6px; } .reihe.klein .chip { min-height: 30px; padding: 4px 10px; }
  .zeile { margin-top: 6px; }
  tr.mein td { background: var(--akz-soft); }
  :root:not([data-look="paper"]):not([data-theme="dark"]) tr.mein td { background: var(--mein-bg); }
  @media (prefers-color-scheme: dark) { :root:not([data-look="paper"]):not([data-theme="light"]) tr.mein td { background: var(--akz-soft); } }
  .mein-marke { font-size: 11px; font-weight: 600; color: var(--akz); border: 1px solid var(--akz); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
  .diff { font-size: 11px; color: var(--muted); font-weight: 400; }
  .diff.plus { color: var(--gut); } .diff.minus { color: var(--schw); }
  .faellig { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .faellig a.tag { text-decoration: none; }
  .score { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; white-space: nowrap; }
  .score i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .score span { font-weight: 400; font-size: 12px; color: var(--muted); }
  .score.gut i { background: var(--gut); } .score.mittel i { background: var(--gelb); } .score.schwach i { background: var(--schw); } .score.offen i { background: var(--line); }
  .score.gut span { color: var(--gut); } .score.schwach span { color: var(--schw); }
  .zahl .w .score { font-size: 18px; margin-right: 8px; }
  /* Ansicht-Reiter: Vergleich | Analyse-Studio */
  [hidden] { display: none !important; }
  .tabs { margin-top: 18px; border-bottom: 1px solid var(--line); gap: 2px; }
  .tab { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; font-weight: 600; padding: 8px 14px; min-height: 40px; color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; font-size: 13px; }
  .tab.an { color: var(--ink); border-bottom-color: var(--marke); }
  a.tab:hover { color: var(--ink); }
  :root[data-look="paper"] .tab.an { border-bottom-color: var(--akz); }
  @media (max-width: 899px) { #kacheln { grid-template-columns: 1fr; } .kachel.halb { grid-column: span 1; } .nur-desktop { display: none; } }

  /* ===== Analyse•Studio, eingebettet (v2.3.3) – Farben und Karten des Vergleichs ===== */
  :root { --raster: #eceef1; --andere: rgba(20,22,26,.42); --h0: #F4F7DC; --h1: #E2EC93; --h2: #C3D52C; --h3: #8E9C17; --h4: #4F5A0B; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --raster: #262a31; --andere: rgba(233,235,238,.45); --h0: #23270E; --h1: #3E4713; --h2: #6F7D19; --h3: #A9BC25; --h4: #E2F06A; } }
  :root[data-theme="dark"] { --raster: #262a31; --andere: rgba(233,235,238,.45); --h0: #23270E; --h1: #3E4713; --h2: #6F7D19; --h3: #A9BC25; --h4: #E2F06A; }
  :root[data-look="paper"] { --raster: #E7DFCC; --andere: rgba(43,38,32,.42); --h0: #F1EDD2; --h1: #DCDD9C; --h2: #B9C43A; --h3: #7F8A2A; --h4: #4C5420; }
  @media (prefers-color-scheme: dark) { :root[data-look="paper"]:not([data-theme="light"]) { --raster: #2E2A25; --andere: rgba(228,220,203,.45); --h0: #2C2D1C; --h1: #47492A; --h2: #737C35; --h3: #A6B045; --h4: #D7DF84; } }
  :root[data-look="paper"][data-theme="dark"] { --raster: #2E2A25; --andere: rgba(228,220,203,.45); --h0: #2C2D1C; --h1: #47492A; --h2: #737C35; --h3: #A6B045; --h4: #D7DF84; }
  /* „Analyse•Studio“ nach der Logo-Logik: Punkt statt Strich, „Studio“ wie „KESS“ */
  .as { white-space: nowrap; } .as-p { display: inline-block; width: .38em; height: .38em; border-radius: 50%; background: var(--marke); margin: 0 .14em; vertical-align: .12em; }
  .as-s { color: var(--ink); background: linear-gradient(transparent 58%, var(--marke) 58%); padding: 0 .08em; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .as-s { background: none; color: var(--marke); } }
  :root[data-theme="dark"] .as-s { background: none; color: var(--marke); }
  #studio { margin-top: 4px; }
  #s-nav { margin-top: 14px; }
  #studio .plakate { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 16px; }
  #studio .plakat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 12px; }
  #studio .plakat .l { font-size: 12px; color: var(--muted); } #studio .plakat .w { font: 700 26px/1.15 var(--titel); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  #studio .plakat .z { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #studio .plakat.dein { background: var(--marke); border-color: var(--marke); color: #0b0b0b; } #studio .plakat.dein .l, #studio .plakat.dein .z { color: rgba(11,11,11,.72); }
  #studio .plakat .sym { width: 26px; height: 26px; }
  #s-flaeche { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
  #studio .kachel-kopf { flex-wrap: wrap; } #studio .frage { color: var(--muted); font-size: 13px; flex: 1; min-width: 180px; }
  #studio .s-werkzeug { display: flex; gap: 4px; margin-left: auto; }
  #studio .knopf { font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; min-height: 32px; cursor: pointer; }
  #studio .knopf:hover { border-color: var(--akz); }
  #studio .nur-bearbeiten { display: none; } body.bearbeiten #studio .nur-bearbeiten { display: inline-flex; }
  #studio select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 40px; }
  #studio .leise { color: var(--muted); font-size: 13px; }
  #studio .leer-hinweis { padding: 18px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); font-size: 14px; } #studio .leer-hinweis b { color: var(--ink); }
  #studio .legende { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; align-items: center; }
  #studio .legende i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -2px; margin-right: 5px; }
  #studio .legende .dein { background: var(--marke); outline: 2px solid var(--ink); outline-offset: -2px; } #studio .legende .andere { background: var(--andere); }
  #studio svg text { font-family: var(--schrift); }
  #studio .chart { width: 100%; max-width: 820px; height: auto; display: block; margin: 0 auto; }
  #studio .achse line { stroke: var(--raster); stroke-width: 1; } #studio .achse text { fill: var(--muted); font-size: 11px; } #studio .achse .basis { stroke: var(--muted); }
  #studio .ttl { fill: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  #studio .punkt { fill: var(--andere); stroke: var(--surface); stroke-width: 2; } #studio .punkt.dein { fill: var(--marke); stroke: var(--ink); stroke-width: 2.5; }
  #studio .balken { fill: var(--andere); } #studio .balken.dein { fill: var(--marke); stroke: var(--ink); stroke-width: 2; }
  #studio .name { fill: var(--ink); font-size: 12px; font-weight: 700; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
  #studio .wert { fill: var(--muted); font-size: 11px; } #studio .trefferflaeche { fill: transparent; }
  #studio .q { fill: var(--bg); } #studio .q.star { fill: var(--marke); fill-opacity: .2; }
  #studio .qname { font: 700 13px var(--titel); fill: var(--ink); text-transform: uppercase; letter-spacing: .04em; }
  #studio .schwelle { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 5; opacity: .45; }
  #studio .wz { color: var(--ink); opacity: .07; } #studio .in-blase { color: var(--surface); } #studio .dein .in-blase, #studio .in-blase.dein { color: #0B0B0B; }
  #studio .sym .voll { fill: currentColor; stroke: none; }
  #studio .pinselpfeil { fill: var(--ink); opacity: .55; } #studio .alt { fill: var(--surface); stroke: var(--ink); stroke-width: 1.8; opacity: .55; }
  #studio .blase { cursor: pointer; outline: none; } #studio .blase.gewaehlt .punkt, #studio .blase:focus-visible .punkt { stroke: var(--ink); stroke-width: 3.5; }
  #studio .netz-gitter { fill: none; stroke: var(--raster); } #studio .netz-speiche { stroke: var(--raster); }
  #studio .netz-dein { fill: var(--marke); fill-opacity: .35; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
  #studio .netz-gruppe { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; }
  #studio .zelle { stroke: var(--surface); stroke-width: 2; } #studio .zelle.leer { fill: var(--surface); stroke: var(--line); stroke-dasharray: 3 3; }
  #studio .skala { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 8px; } #studio .skala span.s { width: 26px; height: 12px; display: inline-block; }
  #studio .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  #studio .post { border: 1px solid var(--line); border-radius: calc(var(--radius) - 2px); background: var(--bg); overflow: hidden; position: relative; }
  #studio .post a { color: inherit; text-decoration: none; } #studio .post a:hover b { text-decoration: underline; }
